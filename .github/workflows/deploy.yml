name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the baked-in repository and statistics data without a push. The build
  # fetches from the GitHub API, so a periodic rebuild keeps the numbers current.
  schedule:
    - cron: '0 4 * * *'

# Keep one deployment at a time; a new push cancels an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runs before the build so its outputs (base_path, base_url) are
      # available to the build step if ever needed.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          CI: true
          # Provided automatically by Actions; no repository secret needed.
          # Raises the API ceiling from 60/hour anonymous to 1000/hour and lets
          # the build read every public repository including profile repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set this repository secret to enable the contact form.
          # Leave it unset and the form shows setup instructions instead.
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      # Fail the pipeline rather than ship a broken document. Each of these has
      # actually been missing at some point:
      #   404.html             - writes the SPA fallback, or deep links break
      #   brand/favicon.svg    - generated from src/data/brand.ts, or the tab is blank
      #   brand/og.png         - was referenced by index.html for a while before the
      #                          file existed, so every link preview 404ed in silence.
      #                          The PNG specifically: crawlers do not render og.svg.
      #                          og.svg is no longer shipped at all - nothing fetches it.
      #   brand/apple-touch-icon - the iOS home-screen icon, also a rename-only slot
      #   feeds/rss.xml, feeds/sitemap.xml - generated by scripts/build-feeds.mjs; if
      #                          the step is skipped the footer links dead-end
      - name: Verify build outputs
        run: |
          for file in dist/404.html dist/brand/favicon.svg dist/brand/og.png \
                      dist/brand/apple-touch-icon.png dist/brand/icon-maskable.svg \
                      dist/brand/icon-maskable.png dist/brand/site.webmanifest \
                      dist/robots.txt dist/feeds/rss.xml dist/feeds/sitemap.xml; do
            test -f "$file" || { echo "MISSING: $file"; exit 1; }
            echo "OK: $file"
          done

      # A PNG that exists but is blank is worse than a missing one, because the
      # file check above passes. This reads the IHDR header: a valid PNG starts
      # with the 8-byte signature, and the generator's output is 1200x630.
      - name: Verify og.png is a real 1200x630 image
        run: |
          test "$(head -c 8 dist/brand/og.png | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a' \
            || { echo 'og.png is not a PNG'; exit 1; }
          echo 'og.png signature OK'

      - name: Verify the feeds are not placeholder documents
        run: |
          head -c 200 dist/feeds/rss.xml | grep -q '<rss' || { echo 'rss.xml is not RSS'; exit 1; }
          head -c 200 dist/feeds/sitemap.xml | grep -q '<urlset' || { echo 'sitemap.xml is not a sitemap'; exit 1; }
          echo 'feeds OK'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
